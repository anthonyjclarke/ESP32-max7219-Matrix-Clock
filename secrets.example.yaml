# Copy this file to secrets.yaml beside the device YAML files (ESP32 or C3).
# In Home Assistant, use the ESPHome folder: /config/esphome/secrets.yaml
# (some editors show homeassistant/esphome/secrets.yaml), not the parent secrets file.
# ESPHome does not load a file named secrets.example.yaml automatically.
# If secrets.yaml already exists, keep it and use its existing secret names.
# Update matching !secret references in max7219-esp32-reg.yaml (also used by C3).
# Example: key: !secret esphome_encryption_key if that name already holds your API key.
# Add only missing credentials; see README.md for the existing-secrets example.
# Replace every example value before installing on hardware.
# Generate the API key with: openssl rand -base64 32
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
api_encryption_key: "REPLACE_WITH_A_BASE64_ENCODED_32_BYTE_KEY"
ota_password: "CHOOSE_A_UNIQUE_OTA_PASSWORD"
fallback_ap_password: "CHOOSE_A_UNIQUE_HOTSPOT_PASSWORD"
